<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1E3A6E"/>
      <stop offset="100%" stop-color="#0E1E35"/>
    </radialGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60AAEE"/>
      <stop offset="100%" stop-color="#3A7CC4"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8E8F8"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEF4FC"/>
      <stop offset="100%" stop-color="#C8DCF0"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D0E4F5"/>
      <stop offset="100%" stop-color="#A8C8E8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="arrowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background full square (OS applies rounding) -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Subtle inner highlight -->
  <ellipse cx="380" cy="280" rx="300" ry="180" fill="white" opacity="0.04"/>

  <!-- ======= ISOMETRIC BOX ======= -->
  <g filter="url(#shadow)">
    <!-- Top face -->
    <polygon
      points="512,310 760,445 512,580 264,445"
      fill="url(#boxTop)"
    />
    <!-- Front-left face -->
    <polygon
      points="264,445 512,580 512,800 264,665"
      fill="url(#boxFront)"
    />
    <!-- Front-right face -->
    <polygon
      points="760,445 512,580 512,800 760,665"
      fill="url(#boxSide)"
    />
  </g>

  <!-- Box edges (outline depth) -->
  <polyline points="264,445 512,310 760,445 512,580 264,445"
    fill="none" stroke="#162B4D" stroke-width="6" stroke-opacity="0.12"/>
  <line x1="512" y1="580" x2="512" y2="800"
    stroke="#162B4D" stroke-width="6" stroke-opacity="0.12"/>
  <line x1="264" y1="665" x2="512" y2="800"
    stroke="#162B4D" stroke-width="6" stroke-opacity="0.12"/>
  <line x1="760" y1="665" x2="512" y2="800"
    stroke="#162B4D" stroke-width="6" stroke-opacity="0.12"/>

  <!-- Tape/ribbon on top face -->
  <polygon
    points="512,310 560,335 512,360 464,335"
    fill="#3A7CC4" opacity="0.55"
  />
  <!-- Tape strip down center of top -->
  <polygon
    points="464,335 512,360 512,580 464,555"
    fill="#3A7CC4" opacity="0.18"
  />
  <polygon
    points="560,335 512,360 512,580 560,555"
    fill="#3A7CC4" opacity="0.22"
  />

  <!-- ======= UPWARD FLOW ARROW ======= -->
  <g filter="url(#arrowGlow)">
    <!-- Arrow shaft -->
    <rect x="478" y="130" width="68" height="210" rx="34"
      fill="url(#arrowGrad)"/>
    <!-- Arrow head -->
    <polygon
      points="512,58 404,200 620,200"
      fill="url(#arrowGrad)"
    />
  </g>

  <!-- Small dot accent (flow sparkle) -->
  <circle cx="398" cy="120" r="14" fill="#60AAEE" opacity="0.55"/>
  <circle cx="626" cy="148" r="9" fill="#60AAEE" opacity="0.38"/>
  <circle cx="360" cy="175" r="6" fill="#60AAEE" opacity="0.25"/>
</svg>
